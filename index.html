<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WEDDINGBOOK — Le livre du mariage</title><style>
:root{--p:#f7f4ec;--i:#111;--m:#777;--l:#d9d4c8;--x:#ff2b8a}*{box-sizing:border-box}body{margin:0;background:#e9e4da;color:var(--i);font-family:Arial,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.top{height:68px;background:var(--p);border-bottom:1px solid var(--l);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}.brand{font-size:12px;font-weight:800;letter-spacing:.18em}.brand span{font-weight:400;opacity:.5}.topRight{display:flex;gap:8px}.role,.save{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px}.role{background:transparent;border:1px solid var(--l)}.save{background:#111;color:#fff;border:0}.main{display:grid;grid-template-columns:210px minmax(0,1fr) 270px;gap:20px;max-width:1450px;margin:auto;padding:25px}.sideTitle,.notesTitle{font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--m);margin:4px 0 12px}.nav{display:flex;flex-direction:column;gap:2px}.nav button{border:0;background:transparent;text-align:left;padding:10px;font-size:11px}.nav button.active{background:#fff;border-left:3px solid var(--x);padding-left:7px;font-weight:700}.progress{margin-top:25px;border-top:1px solid var(--l);padding-top:17px}.bar{height:4px;background:#d5d0c5}.fill{height:4px;background:var(--x);width:35%}.small{font-size:10px;color:var(--m);margin-top:7px}.book{display:grid;grid-template-columns:1fr 1fr;box-shadow:0 20px 60px #1112}.page{background:var(--p);min-height:700px;padding:55px 50px 42px;position:relative}.page:first-child{border-right:1px solid var(--l)}.folio{position:absolute;top:22px;font-size:8px;letter-spacing:.15em;color:var(--m)}.left{left:50px}.right{right:50px}.k{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--x);font-weight:700;margin-bottom:18px}.page h1{font-size:49px;line-height:.93;letter-spacing:-.05em;margin:0 0 18px}.page h2{font-size:27px;line-height:1;margin:0 0 15px}.page p{font-size:12px;line-height:1.65;color:#4c4943}.rule{height:1px;background:var(--l);margin:24px 0}.quote{font:italic 21px/1.35 Georgia,serif}.num{font-size:170px;font-weight:900;color:var(--x);letter-spacing:-.08em;margin-top:55px}.meta{display:grid;grid-template-columns:1fr 1fr;margin-top:24px;border-top:1px solid var(--l)}.meta div{padding:12px 0;border-bottom:1px solid var(--l)}.meta b{display:block;font-size:8px;letter-spacing:.13em;color:var(--m);margin-bottom:5px}.meta span{font-size:11px;font-weight:700}.event{display:grid;grid-template-columns:55px 1fr 9px;gap:10px;padding:13px 0;border-bottom:1px solid var(--l);align-items:center}.event time{font-size:11px;font-weight:800}.event strong{font-size:11px}.event small{display:block;font-size:10px;color:var(--m);margin-top:4px}.dot{width:7px;height:7px;border-radius:50%;background:var(--x)}.noteBox{background:#fff;border:1px solid var(--l);padding:12px;margin-top:15px}.noteHead{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--m);display:flex;justify-content:space-between}.noteText{font-size:11px;line-height:1.5;margin-top:7px}.notesPanel{border-left:1px solid var(--l);padding-left:16px}.noteCard{background:#fff;border:1px solid var(--l);padding:11px;margin-bottom:7px}.noteCard strong{font-size:10px}.noteCard small{font-size:8px;color:var(--m)}.noteCard p{font-size:10px;line-height:1.45;margin:6px 0}.add{width:100%;border:1px dashed #bbb4a7;background:transparent;padding:11px;font-size:8px;letter-spacing:.12em;text-transform:uppercase}.modal{position:fixed;inset:0;background:#1115;display:none;align-items:center;justify-content:center;z-index:30;padding:20px}.modal.open{display:flex}.modalBox{background:var(--p);width:min(500px,100%);padding:26px;box-shadow:0 20px 70px #0003}.modalBox h3{margin:0 0 15px}.modalBox textarea{width:100%;min-height:130px;border:1px solid var(--l);padding:11px;background:#fff}.actions{display:flex;justify-content:flex-end;gap:7px;margin-top:10px}.cancel,.confirm{padding:9px 13px}.cancel{background:transparent;border:1px solid var(--l)}.confirm{background:var(--x);color:#fff;border:0}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:9px 13px;font-size:10px;display:none}.toast.show{display:block}@media(max-width:1050px){.main{grid-template-columns:180px 1fr}.notes{display:none}}@media(max-width:700px){.top{padding:0 15px;height:58px}.main{display:block;padding:10px}.side{display:none}.book{display:block}.page{min-height:650px;padding:48px 28px}.book .page:first-child{display:none}.topRight .save{display:none}}
</style></head><body>
<header class="top"><div class="brand">WEDDINGBOOK <span>— LE LIVRE DU MARIAGE</span></div><div class="topRight"><button class="role" id="role">VOUS — ORGANISATEUR</button><button class="save" id="save">ENREGISTRER</button></div></header>
<main class="main"><aside class="side"><div class="sideTitle">Votre livre</div><nav class="nav" id="nav"></nav><div class="progress"><div class="sideTitle">Préparation</div><div class="bar"><div class="fill"></div></div><div class="small">7 décisions sur 20 validées</div></div></aside><section><div class="book" id="book"></div></section><aside class="notes"><div class="notesPanel"><div class="notesTitle">Notes partagées</div><div id="notes"></div><button class="add" id="add">+ Ajouter une note</button></div></aside></main>
<div class="modal" id="modal"><div class="modalBox"><h3>Ajouter une note au livre</h3><textarea id="input" placeholder="Une remarque, une question, une décision…"></textarea><div class="actions"><button class="cancel" id="cancel">Annuler</button><button class="confirm" id="confirm">Ajouter au livre</button></div></div></div><div class="toast" id="toast"></div>
<script>
const P=[['accueil','Couverture'],['demande','01 — Notre demande'],['vision','02 — Notre vision'],['jour','03 — Jour J'],['prestataires','04 — Prestataires'],['musique','05 — Musique'],['decisions','06 — Décisions']];let cur=0,role='organisateur',notes=JSON.parse(localStorage.getItem('wb-notes')||'[]');const W={names:'Marie & Thomas',date:'12 septembre 2027',place:'Château de la Vallée',guests:'96 invités'};
const nav=document.getElementById('nav'),book=document.getElementById('book'),notesEl=document.getElementById('notes');const esc=s=>s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function left(k,h,b){return '<div class="page"><div class="folio left">WEDDINGBOOK · '+W.names.toUpperCase()+'</div><div class="k">'+k+'</div>'+h+b+'</div>'}function right(b){return '<div class="page"><div class="folio right">'+String(cur+1).padStart(2,'0')+' / '+P.length+'</div>'+b+'</div>'}
function content(i){if(i===0)return left('Livre privé','<h1>'+W.names+'</h1><p>'+W.date+' · '+W.place+'</p><div class="num">01</div><div class="rule"></div><p class="quote">« Nous allons construire ce mariage ensemble, une décision à la fois. »</p>')+right('<div class="k">Le livre du mariage</div><h2>Un livre vivant.</h2><p>Votre demande, vos choix, vos prestataires, votre musique et les décisions importantes réunis au même endroit.</p><div class="meta"><div><b>Date</b><span>'+W.date+'</span></div><div><b>Lieu</b><span>'+W.place+'</span></div><div><b>Invités</b><span>'+W.guests+'</span></div><div><b>Statut</b><span>En préparation</span></div></div><div class="rule"></div><p><b>Comment l’utiliser</b><br>Ajoutez une note pour discuter. Validez une décision pour figer le choix. Le livre évolue avec vous.</p>');if(i===1)return left('01 · Votre demande','<h2>Ce que vous nous avez demandé.</h2>','<p>Un mariage élégant mais pas froid. Une journée fluide, beaucoup de musique et un moment vraiment personnel pour la cérémonie.</p><div class="rule"></div><p><b>Priorités</b><br>• Cérémonie émotionnelle<br>• Cocktail vivant<br>• Une vraie place pour la musique<br>• Une soirée naturelle</p><div class="noteBox"><div class="noteHead"><span>Matt · note</span><span>01</span></div><div class="noteText">Je vous propose de construire la timeline autour de la musique.</div></div>')+right('<div class="k">Votre réponse</div><p class="quote">« Nous voulons que tout paraisse naturel. »</p><div class="meta"><div><b>Ambiance</b><span>Chaleureuse</span></div><div><b>Style</b><span>Contemporain</span></div><div><b>Musique</b><span>Très importante</span></div><div><b>Formalité</b><span>Faible</span></div></div>');if(i===2)return left('02 · Notre vision','<h2>Élégant, chaleureux, contemporain.</h2>','<p>Une direction visuelle claire, sans surcharge.</p><div class="meta"><div><b>Palette</b><span>Ivoire · noir · fuchsia</span></div><div><b>Fleurs</b><span>À confirmer</span></div><div><b>Dress code</b><span>Chic libre</span></div><div><b>Photos</b><span>Naturelles</span></div></div>')+right('<div class="k">Références</div><p class="quote">Pas de décor gratuit. Chaque choix doit servir l’expérience.</p><div class="rule"></div><p>Ajoutez inspirations, images ou liens. Un élément peut ensuite devenir une décision du livre.</p>');if(i===3)return left('03 · Jour J','<h2>Le jour, minute par minute.</h2>','<div>'+[['09:00','Préparatifs','Lieu privé'],['11:00','Photos','Premiers portraits'],['15:00','Cérémonie','Musique live'],['16:15','Cocktail','Musique & invités'],['19:30','Dîner','Entrée en salle'],['22:30','Soirée','Ouverture de bal']].map(e=>'<div class="event"><time>'+e[0]+'</time><div><strong>'+e[1]+'</strong><small>'+e[2]+'</small></div><span class="dot"></span></div>').join('')+'</div>')+right('<div class="k">Notes de production</div><p>Les horaires validés deviennent la référence commune.</p><div class="noteBox"><div class="noteHead"><span>À confirmer</span><span>01</span></div><div class="noteText">Prévoir 20 minutes de marge entre cérémonie et cocktail.</div></div>');if(i===4)return left('04 · Prestataires','<h2>Les personnes qui font le jour.</h2>','<div>'+[['Lieu','Château de la Vallée','VALIDÉ'],['Photo','Camille Studio','À CONFIRMER'],['DJ','Studio 24','À CONFIRMER'],['Saxophone','Matt Mez','VALIDÉ'],['Traiteur','Maison L.','À CONFIRMER']].map(e=>'<div class="event"><time>'+e[2].slice(0,2)+'</time><div><strong>'+e[0]+'</strong><small>'+e[1]+'</small></div><span class="dot"></span></div>').join('')+'</div>')+right('<div class="k">Suivi</div><p>Chaque prestataire peut avoir ses informations, documents et notes.</p><p class="quote">Le livre rassemble la vision opérationnelle du mariage.</p>');if(i===5)return left('05 · Musique','<h2>La bande-son du mariage.</h2>','<div>'+[['Cérémonie','River Flows in You','À VALIDER'],['Entrée','Perfect — acoustic','VALIDÉ'],['Cocktail','Playlist live','À CONFIRMER'],['Ouverture','À choisir ensemble','À FAIRE']].map(e=>'<div class="event"><time>♪</time><div><strong>'+e[0]+'</strong><small>'+e[1]+'</small></div><span class="dot"></span></div>').join('')+'</div>')+right('<div class="k">Votre musique</div><p>Ajoutez les morceaux préférés, ceux à éviter et les moments musicaux.</p><div class="noteBox"><div class="noteHead"><span>Marie & Thomas</span><span>question</span></div><div class="noteText">On veut écouter la version acoustique en entier avant de décider.</div></div>');return left('06 · Décisions','<h2>À confirmer / validé.</h2>','<div>'+[['Musique entrée','Validé'],['Photographe','À confirmer'],['Fleurs','À confirmer'],['Timeline cocktail','Validé'],['Ouverture de bal','À faire']].map(e=>'<div class="event"><time>—</time><div><strong>'+e[0]+'</strong><small>'+e[1]+'</small></div><span class="dot"></span></div>').join('')+'</div>')+right('<div class="k">La règle du livre</div><p class="quote">Une décision importante n’existe que lorsqu’elle est écrite et validée.</p><div class="rule"></div><p>Les notes servent à discuter. Les statuts servent à figer les décisions.</p>')}
function render(){nav.innerHTML=P.map((p,i)=>'<button class="'+(i===cur?'active':'')+'" data-i="'+i+'">'+p[1]+'</button>').join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;render()});book.innerHTML=content(cur);const list=notes.filter(n=>n.page===cur).reverse();notesEl.innerHTML=list.length?list.map(n=>'<div class="noteCard"><strong>'+esc(n.author)+'</strong><small> · '+new Date(n.at).toLocaleDateString('fr-FR')+'</small><p>'+esc(n.text)+'</p></div>').join(''):'<p style="font-size:10px;color:#777">Aucune note sur cette page.</p>'}
document.getElementById('add').onclick=()=>{document.getElementById('input').value='';document.getElementById('modal').classList.add('open');document.getElementById('input').focus()};document.getElementById('cancel').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('confirm').onclick=()=>{let t=document.getElementById('input').value.trim();if(!t)return;notes.push({page:cur,text:t,author:role==='organisateur'?'Matt':'Marie & Thomas',at:new Date().toISOString()});localStorage.setItem('wb-notes',JSON.stringify(notes));document.getElementById('modal').classList.remove('open');render();show('Note ajoutée au livre')};document.getElementById('role').onclick=()=>{role=role==='organisateur'?'couple':'organisateur';document.getElementById('role').textContent=role==='organisateur'?'VOUS — ORGANISATEUR':'VOUS — MARIE & THOMAS';show(role==='organisateur'?'Mode organisateur':'Mode couple')};document.getElementById('save').onclick=()=>{localStorage.setItem('wb-notes',JSON.stringify(notes));show('Livre enregistré')};function show(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}render();
</script></body></html>
